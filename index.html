      toast('Added Push, Pull and Legs. Edit them to fit your training.');
    },
    'start-empty': () => startFrom(null),
    'start-routine': (b) => { const r = state.routines.find((x) => x.id === b.dataset.id); if (r) startFrom(r); },
    repeat: (b) => { const s = state.sessions.find((x) => x.id === b.dataset.id); if (s) startFrom(s, true); },
    'session-to-routine': async (b) => {
      const s = state.sessions.find((x) => x.id === b.dataset.id); if (!s) return;
      if (await store.put('routines', routineFromExercises(s.name || 'Routine', s.exercises || []))) toast(`Saved “${s.name}” as a routine`);
    },
    tick: (b) => { const ex = findEx(b.dataset.ex); if (!ex) return; const s = ex.sets[+b.dataset.i]; s.done = !s.done; saveDraft(); render(); },
    'set-add': (b) => { const ex = findEx(b.dataset.ex); if (!ex) return; const l = ex.sets[ex.sets.length - 1]; ex.sets.push({ w: l ? l.w : '', p: l ? l.p || '' : '', r: l ? l.r : '', done: false }); saveDraft(); render(); const el = document.getElementById(`${ex.mode === 'pin' ? 'p' : 'w'}-${ex.id}-${ex.sets.length - 1}`); if (el) el.focus(); },
    mode: (b) => {
      const ex = findEx(b.dataset.ex); if (!ex || ex.mode === b.dataset.m) return;
      ex.mode = b.dataset.m;
      if (ex.mode === 'pin' && !machineFor(ex.name) && !state.setup[ex.id]) {
        const guess = HS_SELECT.findIndex((p) => norm(ex.name).includes(norm(p[0])));
        state.setup[ex.id] = guess >= 0 ? { preset: guess, total: String(presetTotal(HS_SELECT[guess], state.draft.unit)), pins: '', first: '' } : { preset: '', total: '', pins: '', first: '' };
      }

    'ms-edit': (b) => {

      state.setup[ex.id] = { preset: '', total: String(round2(conv(m.total, m.unit, u))), pins: String(m.pins), first: m.first > 0 ? String(round2(conv(m.first, m.unit, u))) : '' };

    'ms-cancel': (b) => { delete state.setup[b.dataset.ex]; render(); },
    'ms-save': async (b) => {
      const ex = findEx(b.dataset.ex); const s = state.setup[b.dataset.ex] || {}; if (!ex) return;
      const name = ex.name.trim(); const total = num(s.total), pins = parseInt(s.pins, 10), first = num(s.first);
      if (!name) { toast('Name the exercise first.'); return; }
      if (!(total > 0)) { toast('Enter the stack total, or pick the machine from the list.'); return; }
      if (!(pins > 0 && pins <= 60)) { toast('Enter how many pins the stack has.'); return; }
      if (first != null && (first <= 0 || first > total)) { toast('Pin 1 weight should be more than 0 and no more than the stack total.'); return; }
      const existing = machineFor(name);
      const cfg = { id: existing ? existing.id : slug(name), name, unit: state.draft.unit, total, pins, first: first > 0 ? first : null };
      delete state.setup[ex.id];
      if (await store.put('machines', cfg)) toast(`Saved ${name}: ${pins} pins`); else { state.setup[ex.id] = s; render(); }
    },
    'del-machine': async (b) => { if (!arm('mdel-' + b.dataset.id)) return; if (await store.del('machines', b.dataset.id)) toast('Machine removed'); },
    'set-remove': (b) => { const ex = findEx(b.dataset.ex); if (!ex) return; ex.sets.splice(+b.dataset.i, 1); saveDraft(); render(); },
    'ex-remove': (b) => { if (!arm('exrm-' + b.dataset.ex)) return; state.draft.exercises = state.draft.exercises.filter((x) => x.id !== b.dataset.ex); saveDraft(); render(); },
    discard: () => { if (!arm('discard')) return; state.draft = null; saveDraft(); render(); toast('Session discarded'); },
    'draft-to-routine': async () => {
      const d = state.draft; if (!d.exercises.some((e) => norm(e.name))) { toast('Add at least one exercise first.'); return; }
      if (await store.put('routines', routineFromExercises(d.name.trim() || 'My routine', d.exercises))) toast(`Saved “${d.name.trim() || 'My routine'}” as a routine`);
    },
    finish: async () => {
      const d = state.draft;
      const exs = [];
      // A set counts if it was ticked done. If nothing was ticked, count sets with both a load and reps filled in.
      const anyTicked = d.exercises.some((ex) => ex.sets.some((s) => s.done));
      const counts = (s, pin) => (parseInt(s.r, 10) || 0) > 0 && (anyTicked ? !!s.done : (pin ? parseInt(s.p, 10) > 0 : String(s.w ?? '').trim() !== ''));
      for (const ex of d.exercises) {
        const pin = ex.mode === 'pin', cfg = pin ? machineFor(ex.name) : null;
        const sets = ex.sets.filter((s) => counts(s, pin)).map((s) => (pin ? { w: pinWeight(cfg, s.p, d.unit) ?? 0, r: parseInt(s.r, 10) || 0, p: parseInt(s.p, 10) || 0 } : { w: num(s.w) ?? 0, r: parseInt(s.r, 10) || 0 }));
        if (pin && !cfg && sets.length) { toast(`Set up the pin stack for ${ex.name.trim() || 'this machine'} first, or switch it to Weight.`); return; }
        if (sets.length) exs.push({ name: ex.name.trim() || 'Exercise', sets });
      }
      if (!exs.length) { toast(anyTicked ? 'Enter reps for the sets you ticked before saving.' : 'Tick off the sets you did, or fill in weight and reps, before saving.'); return; }
      const prs = [];
      exs.forEach((ex) => { const top = Math.max(...ex.sets.map((s) => s.w)); const prev = bestTop(ex.name, d.unit); if (prev != null && top > prev + 1e-9) prs.push(`${ex.name} ${fmtW(top)} ${d.unit}`); });
      const session = { id: d.id, name: d.name.trim() || 'Session', date: d.date || todayISO(), unit: d.unit, startedAt: d.startedAt, finishedAt: Date.now(), exercises: exs };
      const keep = d; state.draft = null; saveDraft();
      if (await store.put('sessions', session)) { toast(prs.length ? `Saved. New best: ${prs.join(', ')}` : 'Session saved'); go('log'); }
      else { state.draft = keep; saveDraft(); render(); }
    },
    'del-session': async (b) => { if (!arm('sdel-' + b.dataset.id)) return; state.openHist.delete(b.dataset.id); if (await store.del('sessions', b.dataset.id)) toast('Session deleted'); },
    'pk-open': (b) => { state.picker = { ctx: b.dataset.ctx, q: '', g: '' }; render(); const el = $('#pk-q'); if (el) el.focus({ preventScroll: true }); },
    export: () => exportBackup(),
    'me-edit': () => { state.meEdit = true; render(); const el = $('#me-bw'); if (el) el.focus({ preventScroll: true }); },
    'me-cancel': () => { state.meEdit = false; render(); },
    'me-save': async () => {
      const bw = num($('#me-bw') && $('#me-bw').value), sex = $('#me-sex') ? $('#me-sex').value : '';
      const kg = bw != null ? conv(bw, state.unit, 'kg') : null;
      if (!(kg >= 30 && kg <= 250)) { toast('Enter your bodyweight in ' + state.unit + '.'); return; }
      if (!sex) { toast('Choose which standards to compare with.'); return; }
      const prev = { bw: state.bw, sex: state.sex };
      state.bw = round2(kg); state.sex = sex; state.meEdit = false; render();
      if (await store.putUnit(state.unit)) toast('Saved. Strength levels updated.'); else { state.bw = prev.bw; state.sex = prev.sex; render(); }
    },
    'pick-prog': (b) => { state.progEx = b.dataset.name; render(); window.scrollTo({ top: 0, behavior: 'smooth' }); },
    'clear-filter': (b) => { state.f[b.dataset.view] = { q: '', g: '' }; render(); },
    'pk-close': () => { state.picker = null; render(); },
    'pk-add': (b) => pickExercise(b.dataset.name || ''),
    'new-routine': () => { state.edit = { id: uid(), name: '', exercises: [] }; state.picker = { ctx: 'routine', q: '', g: '' }; go('routines'); setTimeout(() => { const el = $('#r-name'); if (el) el.focus(); }, 0); },
    'edit-routine': (b) => { const r = state.routines.find((x) => x.id === b.dataset.id); if (!r) return; state.edit = JSON.parse(JSON.stringify(r)); state.picker = null; render(); window.scrollTo(0, 0); },
    'del-routine': async (b) => { if (!arm('rdel-' + b.dataset.id)) return; if (await store.del('routines', b.dataset.id)) toast('Routine deleted'); },
    'r-add-row': () => { const l = state.edit.exercises[state.edit.exercises.length - 1]; state.edit.exercises.push({ name: '', sets: l ? l.sets : '3', reps: l ? l.reps : '8' }); render(); const el = document.getElementById('re-n-' + (state.edit.exercises.length - 1)); if (el) el.focus(); },
    'r-remove-row': (b) => { state.edit.exercises.splice(+b.dataset.i, 1); render(); },
    'r-cancel': () => { state.edit = null; state.picker = null; render(); },
    'r-save': async () => {
      const r = state.edit; const name = r.name.trim();
      const exercises = r.exercises.filter((e) => norm(e.name)).map((e) => ({ name: e.name.trim(), sets: Math.max(1, Math.min(12, parseInt(e.sets, 10) || 3)), reps: String(e.reps || '').trim() || '8' }));
      if (!name) { toast('Give the routine a name.'); $('#r-name')?.focus(); return; }
      if (!exercises.length) { toast('Add at least one exercise.'); return; }
      const out = { id: r.id, name, exercises }; state.edit = null; state.picker = null;
      if (await store.put('routines', out)) toast(`Saved “${name}”`); else { state.edit = r; render(); }
    },
    metric: (b) => { state.progMetric = b.dataset.m; render(); },
  };

  document.addEventListener('click', (e) => {
    const b = e.target.closest('[data-act]'); if (!b) return;
    const fn = acts[b.dataset.act]; if (!fn) return;
    if (b.closest('summary')) e.preventDefault();
    fn(b, e);
  });
  document.addEventListener('submit', (e) => {
    e.preventDefault();
    if (e.target.dataset.form === 'add-ex' && state.draft) {
      const inp = $('#add-ex'); const name = inp.value.trim(); if (!name) { inp.focus(); return; }
      const last = lastFor(name); const u = state.draft.unit;
      const sets = last ? last.sets.map((s) => ({ w: String(round2(conv(s.w, last.unit, u))), p: s.p ? String(s.p) : '', r: String(s.r), done: false })) : [{ w: '', p: '', r: '', done: false }];
      state.draft.exercises.push({ id: uid(), name, mode: machineFor(name) || (last && last.sets.some((s) => s.p)) ? 'pin' : 'weight', sets }); saveDraft(); render();
      const el = $('#add-ex'); if (el) el.focus();
    }
  });
  document.addEventListener('input', (e) => {
    const t = e.target;
    if (t.dataset.draft && state.draft) { state.draft[t.dataset.draft] = t.value; saveDraft(); return; }
    if (t.dataset.pk && state.picker) { state.picker[t.dataset.pk] = t.value; render(); return; }
    if (t.dataset.filter) { const [view, key] = t.dataset.filter.split('.'); state.f[view][key] = t.value; render(); return; }
    if (t.dataset.ms && state.draft) {
      const id = t.dataset.ex; const s = state.setup[id] || (state.setup[id] = {});
      s[t.dataset.ms] = t.value;
      if (t.dataset.ms === 'preset') { const p = HS_SELECT[+t.value]; if (t.value !== '' && p) s.total = String(presetTotal(p, state.draft.unit)); render(); return; }
      const pv = document.getElementById('ms-prev-' + id); if (pv) pv.textContent = setupPreview(s, state.draft.unit); return;
    }
    if (t.dataset.f && state.draft) {
      const ex = findEx(t.dataset.ex); if (!ex) return;
      if (t.dataset.f === 'name') ex.name = t.value; else if (ex.sets[+t.dataset.i]) ex.sets[+t.dataset.i][t.dataset.f] = t.value;
      saveDraft();
      if (t.dataset.f === 'p') { const pw = document.getElementById(`pw-${ex.id}-${t.dataset.i}`); const w = pinWeight(machineFor(ex.name), t.value, state.draft.unit); if (pw) pw.textContent = w == null ? '–' : '≈' + fmtW(w); return; }
      const pl = document.getElementById('pl-' + ex.id); if (pl && ex.mode !== 'pin') pl.innerHTML = plateText(ex, state.draft.unit); return;
    }
    if (t.dataset.rf && state.edit) { if (t.dataset.rf === 'rname') state.edit.name = t.value; else { const row = state.edit.exercises[+t.dataset.i]; if (row) row[t.dataset.rf] = t.value; } }
  });
  document.addEventListener('keydown', (e) => {
    if (e.key !== 'Enter' || e.target.id !== 'pk-q' || !state.picker) return;
    e.preventDefault(); const q = state.picker.q.trim(); if (!q) return;
    const hit = library().find((x) => norm(x.name) === norm(q)) || library().filter((x) => matches(x.name, q, state.picker.g))[0];
    pickExercise(hit && norm(hit.name).startsWith(norm(q)) ? hit.name : q);
  });
  document.addEventListener('keydown', (e) => { if ((e.key === 'Enter' || e.key === ' ') && e.target.matches && e.target.matches('label[for="import-file"]')) { e.preventDefault(); const f = $('#import-file'); if (f) f.click(); } });
  document.addEventListener('change', (e) => {
    if (e.target.id === 'prog-ex') { state.progEx = e.target.value; render(); }
    if (e.target.id === 'import-file' && e.target.files && e.target.files[0]) { const f = e.target.files[0]; e.target.value = ''; importBackup(f); }
  });
  document.addEventListener('toggle', (e) => { const d = e.target; if (d.dataset && d.dataset.hid) { if (d.open) state.openHist.add(d.dataset.hid); else state.openHist.delete(d.dataset.hid); } }, true);
  window.addEventListener('hashchange', () => { const t = location.hash.slice(1); if (TABS.includes(t) && t !== state.tab) { state.tab = t; render(); } });
  let rz; window.addEventListener('resize', () => { clearTimeout(rz); rz = setTimeout(() => { if (state.tab === 'progress') drawChart(); }, 150); });
  setInterval(() => { const el = $('#elapsed'); if (el && state.draft) el.textContent = elapsed(state.draft); }, 30000);

  render();
  store.init();
})();
</script>
<script>
if ('serviceWorker' in navigator) {
  window.addEventListener('load', function () { navigator.serviceWorker.register('sw.js').catch(function () {}); });
}
if (navigator.storage && navigator.storage.persist) { navigator.storage.persist().catch(function () {}); }
</script>
